# Canonical schema for entries/YYYY/MM/DD/{session_id[:8]}.yaml

$schema: "https://json-schema.org/draft/2020-12/schema"
title: DevDiaryEntry
type: object
required: [session_id, agent, user, started_at, turns]
properties:

  session_id:
    type: string
    description: Full UUID for the session.

  agent:
    type: object
    required: [name]
    properties:
      name:    { type: string, enum: [claude-code, cursor, gemini, codex, copilot, other] }
      model:   { type: string }
      version: { type: string }

  user:
    type: object
    properties:
      git_name:  { type: string }
      git_email: { type: string }

  project:
    type: object
    properties:
      repo:   { type: string }
      branch: { type: string }

  issue:
    type: object
    properties:
      ref: { type: string, description: "e.g. #123, PROJ-456" }
      url: { type: string }

  languages:
    type: array
    items: { type: string }

  started_at: { type: string, format: date-time }
  ended_at:   { type: string, format: date-time }

  turns:
    type: array
    items:
      type: object
      required: [id, started_at, ended_at]
      properties:
        id:         { type: string, description: "turn-1, turn-2, …" }
        prompt:     { type: string, description: "User's message that opened this turn." }
        started_at: { type: string, format: date-time }
        ended_at:   { type: string, format: date-time }
        actions:
          type: array
          description: Technical actions Claude took — file edits, commands, tool calls.
          items:
            type: object
            required: [type]
            properties:
              type:    { type: string, enum: [file_edit, command, tool_use] }
              tool:    { type: string, description: "Edit, Write, MultiEdit, Bash, …" }
              file:    { type: string }
              diff:    { type: string, description: "Unified diff for Edit actions." }
              lines:   { type: integer, description: "Total lines for Write actions." }
              snippet: { type: string, description: "First ~20 lines of written content." }
              edits:
                type: array
                description: Per-edit diffs for MultiEdit.
                items:
                  type: object
                  properties:
                    diff: { type: string }
              cmd:     { type: string, description: "Shell command for Bash actions." }
              output:  { type: string, description: "Stdout/stderr of the command." }
              summary: { type: string }

  summary:
    type: object
    properties:
      files_changed: { type: array, items: { type: string } }
      commands_run:  { type: integer }
      turns:         { type: integer }
